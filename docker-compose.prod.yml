services:

  postgres:
    image: postgres:16
    container_name: usai_postgres_prod
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  backend:
    build:
      context: ./backend

    container_name: usai_backend_prod
    restart: unless-stopped

    env_file:
      - .env

    expose:
      - "8000"

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1

    container_name: usai_frontend_prod
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend


volumes:
  postgres_data_prod: